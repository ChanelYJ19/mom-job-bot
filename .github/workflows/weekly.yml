name: Weekly Job Digest

on:
  schedule:
    # Mondays at 11:00 UTC = 7:00 AM ET (EST) / 8:00 AM ET (EDT)
    - cron: "0 11 * * 1"
  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen_jobs database
        uses: actions/cache@v4
        with:
          path: data/seen_jobs.sqlite
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: seen-jobs-db-

      - name: Run job bot
        env:
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python run_weekly.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-log-${{ github.run_id }}
          path: data/last_run.log
          retention-days: 30
